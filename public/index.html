<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceFlow</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f6f8; color: #202124; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .header { height: 64px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
    .logo { font-size: 21px; font-weight: 700; }
    .role-select { width: 160px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
    .layout { display: flex; min-height: calc(100vh - 64px); }
    .sidebar { width: 230px; flex-shrink: 0; background: #fff; border-right: 1px solid #ddd; padding: 20px 14px; }
    .sidebar button { display: block; width: 100%; padding: 11px 12px; margin-bottom: 6px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
    .sidebar button:hover, .sidebar button.active { background: #eef1f5; }
    .content { flex: 1; max-width: 1100px; padding: 30px; }
    h1 { margin-top: 0; }
    h3 { margin-top: 0; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 18px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    input:disabled { background: #f1f3f4; color: #777; }
    textarea { min-height: 100px; resize: vertical; }
    .button { border: 0; border-radius: 8px; padding: 10px 15px; background: #202124; color: #fff; }
    .button:hover { opacity: .9; }
    .button.secondary { background: #e9eaed; color: #202124; }
    .button.danger { background: #b42318; }
    .button.success { background: #137333; }
    .button + .button { margin-left: 6px; }
    .request-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
    .request-actions .button { margin: 0; }
    .request { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 10px; background: #fff; }
    .request-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 8px; }
    .request-number { font-weight: 700; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 6px; background: #eef1f5; font-size: 13px; white-space: nowrap; }
    .request-info { color: #555; margin: 5px 0; }
    .actions { margin-top: 12px; }
    .budget-info { padding: 10px 12px; border-radius: 8px; background: #f1f3f4; margin-top: 8px; font-size: 14px; }
    .budget-list { width: 100%; border-collapse: collapse; }
    .budget-list th, .budget-list td { padding: 12px 8px; border-bottom: 1px solid #ddd; text-align: left; }
    .category-title { font-weight: 700; font-size: 16px; }
    .category-description { color: #666; margin-top: 5px; }
    .category-actions { margin-top: 12px; }
    .one-c-link { display: inline-block; margin-top: 10px; color: #137333; text-decoration: none; font-weight: 600; }
    .one-c-link:hover { text-decoration: underline; }
    .hidden { display: none; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #eef1f5; }
    .error { background: #fdecec; color: #9b1c1c; }
    .success-message { background: #eaf7ed; color: #176b2c; }
    .empty { color: #777; padding: 20px 0; }
    @media (max-width: 700px) {
      .header { padding: 0 16px; }
      .role-select { width: 145px; }
      .layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid #ddd; }
      .content { padding: 20px 16px; }
      .budget-list { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">FinanceFlow</div>
    <select id="roleSelect" class="role-select">
      <option value="employee" selected>Сотрудник</option>
      <option value="manager">Руководитель</option>
    </select>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div id="message"></div>
      <div id="app"></div>
    </main>
  </div>
  <script>
    const API = '/api';
    const ONE_C_BASE_URL = 'http://localhost/InfoBase/hs/financeflow/paymentid/';    let requests = [];
    let categories = [];
    let budgets = [];

    // Показываем сообщение пользователю.
    function showMessage(text, type = '') {
      const message = document.getElementById('message');
      message.className = `message ${type}`;
      message.textContent = text;
    }

    // Очищаем сообщение пользователя.
    function clearMessage() {
      const message = document.getElementById('message');
      message.className = '';
      message.textContent = '';
    }

    // Выполняем HTTP-запрос к API FinanceFlow.
    async function api(path, options = {}) {
      const response = await fetch(`${API}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || data.error || 'Ошибка API');
      }
      return data;
    }

    // Загружаем список заявок.
    async function loadRequests() {
      requests = await api('/requests');
    }

    // Загружаем статьи расходов.
    async function loadCategories() {
      categories = await api('/categories');
    }

    // Загружаем бюджеты.
    async function loadBudgets() {
      budgets = await api('/budgets');
    }

    // Форматируем денежную сумму.
    function formatMoney(value) {
      return Number(value).toLocaleString('ru-RU') + ' ₽';
    }

    // Возвращаем русское название статуса.
    function statusName(status) {
      const statuses = {
        draft: 'Черновик',
        pending_approval: 'На согласовании',
        approved: 'Согласована',
        rejected: 'Отклонена',
        paid: 'Оплачена'
      };
      return statuses[status] || status;
    }

    // Экранируем текст перед вставкой в HTML.
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Формируем ссылку на HTML-карточку документа 1С.
    function getOneCDocumentUrl(documentId) {
      return `${ONE_C_BASE_URL}${encodeURIComponent(documentId)}`;
    }

    // Показываем меню сотрудника.
    function renderEmployeeMenu() {
      document.getElementById('sidebar').innerHTML = `
        <button class="active" onclick="showEmployeeRequests()">Мои заявки</button>
        <button onclick="showCreateRequest()">Создать заявку</button>
      `;
    }

    // Показываем меню руководителя.
    function renderManagerMenu() {
      document.getElementById('sidebar').innerHTML = `
        <button class="active" onclick="showManagerRequests()">Заявки</button>
        <button onclick="showBudgets()">Бюджеты</button>
        <button onclick="showCategories()">Статьи расходов</button>
      `;
    }

    // Показываем заявки сотрудника.
    async function showEmployeeRequests() {
      clearMessage();
      renderEmployeeMenu();
      try {
        await loadRequests();
        document.getElementById('app').innerHTML = `
          <h1>Мои заявки</h1>
          <div class="card">
            ${requests.length ? requests.map(renderRequest).join('') : '<div class="empty">Заявок пока нет.</div>'}
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Показываем форму создания заявки.
    async function showCreateRequest() {
      clearMessage();
      renderEmployeeMenu();
      try {
        await Promise.all([loadCategories(), loadBudgets()]);
        document.getElementById('app').innerHTML = `
          <h1>Новая заявка</h1>
          <div class="card">
            <div class="form-group">
              <label>Номер заявки</label>
              <input value="Будет создан автоматически" disabled>
            </div>
            <div class="form-group">
              <label for="amount">Сумма</label>
              <input id="amount" type="number" min="1" placeholder="30000">
            </div>
            <div class="form-group">
              <label for="category">Статья расходов</label>
              <select id="category" onchange="showCategoryBudget()">
                <option value="">Выберите статью</option>
                ${categories.map(category => `
                  <option value="${category.id}">${escapeHtml(category.name)}</option>
                `).join('')}
              </select>
              <div id="categoryBudget" class="budget-info hidden"></div>
            </div>
            <div class="form-group">
              <label for="description">Описание</label>
              <textarea id="description" placeholder="Например: Оплата услуг подрядчика"></textarea>
            </div>
            <button class="button" onclick="createRequest()">Создать заявку</button>
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Показываем доступный бюджет выбранной статьи.
    function showCategoryBudget() {
      const categoryId = Number(document.getElementById('category').value);
      const block = document.getElementById('categoryBudget');
      const budget = budgets.find(item => Number(item.category_id) === categoryId);
      if (!categoryId || !budget) {
        block.classList.add('hidden');
        return;
      }
      const remaining = Number(budget.limit_amount) - Number(budget.reserved_amount || 0);
      block.classList.remove('hidden');
      block.textContent = `Доступный бюджет: ${formatMoney(remaining)}`;
    }

    // Создаём новую заявку.
    async function createRequest() {
      clearMessage();
      const amount = Number(document.getElementById('amount').value);
      const categoryId = Number(document.getElementById('category').value);
      const description = document.getElementById('description').value.trim();
      if (!amount || amount <= 0) {
        showMessage('Введите сумму заявки', 'error');
        return;
      }
      if (!categoryId) {
        showMessage('Выберите статью расходов', 'error');
        return;
      }
      if (!description) {
        showMessage('Введите описание заявки', 'error');
        return;
      }
      try {
        const request = await api('/requests', {
          method: 'POST',
          body: JSON.stringify({ amount, categoryId, description })
        });
        showMessage(`Заявка ${request.number} создана`, 'success-message');
        await showEmployeeRequests();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Формируем карточку заявки сотрудника.
    function renderRequest(request) {
      return `
        <div class="request">
          <div class="request-header">
            <div class="request-number">${escapeHtml(request.number)}</div>
            <span class="status">${statusName(request.status)}</span>
          </div>
          <div class="request-info">Сумма: <strong>${formatMoney(request.amount)}</strong></div>
          <div class="request-info">Статья: ${escapeHtml(request.category_name || 'Не указана')}</div>
          <div class="request-info">${escapeHtml(request.description)}</div>
          ${request.oneC_documentId ? `
            <a class="one-c-link" href="${getOneCDocumentUrl(request.oneC_documentId)}" target="_blank">
              Документ 1С № ${escapeHtml(request.oneC_documentNumber || '')} ↗
            </a>
          ` : ''}
          <div class="actions">
            ${request.status === 'draft' ? `
              <div class="request-actions">
                <button class="button secondary" onclick="editRequest(${request.id})">Изменить</button>
                <button class="button danger" onclick="deleteRequest(${request.id})">Удалить</button>
                <button class="button" onclick="submitRequest(${request.id})">Отправить на согласование</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // Открываем форму редактирования черновика.
    async function editRequest(id) {
      const request = requests.find(item => Number(item.id) === Number(id));
      if (!request || request.status !== 'draft') return;
      clearMessage();
      try {
        await loadCategories();
        document.getElementById('app').innerHTML = `
          <h1>Редактирование заявки</h1>
          <div class="card">
            <div class="form-group">
              <label>Номер заявки</label>
              <input value="${escapeHtml(request.number)}" disabled>
            </div>
            <div class="form-group">
              <label for="editAmount">Сумма</label>
              <input id="editAmount" type="number" min="1" value="${request.amount}">
            </div>
            <div class="form-group">
              <label for="editCategory">Статья расходов</label>
              <select id="editCategory">
                ${categories.map(category => `
                  <option value="${category.id}" ${Number(category.id) === Number(request.category_id) ? 'selected' : ''}>
                    ${escapeHtml(category.name)}
                  </option>
                `).join('')}
              </select>
            </div>
            <div class="form-group">
              <label for="editDescription">Описание</label>
              <textarea id="editDescription">${escapeHtml(request.description)}</textarea>
            </div>
            <button class="button" onclick="saveRequest(${request.id})">Сохранить</button>
            <button class="button secondary" onclick="showEmployeeRequests()">Отмена</button>
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Сохраняем изменения черновика.
    async function saveRequest(id) {
      const amount = Number(document.getElementById('editAmount').value);
      const categoryId = Number(document.getElementById('editCategory').value);
      const description = document.getElementById('editDescription').value.trim();
      if (!amount || amount <= 0) {
        showMessage('Введите корректную сумму', 'error');
        return;
      }
      if (!categoryId) {
        showMessage('Выберите статью расходов', 'error');
        return;
      }
      if (!description) {
        showMessage('Введите описание заявки', 'error');
        return;
      }
      try {
        await api(`/requests/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ amount, categoryId, description })
        });
        showMessage('Заявка изменена', 'success-message');
        await showEmployeeRequests();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Удаляем черновик заявки после подтверждения.
    async function deleteRequest(id) {
      const request = requests.find(item => Number(item.id) === Number(id));
      if (!request || request.status !== 'draft') return;
      if (!confirm(`Удалить заявку ${request.number}?`)) return;
      try {
        await api(`/requests/${id}`, { method: 'DELETE' });
        showMessage(`Заявка ${request.number} удалена`, 'success-message');
        await showEmployeeRequests();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Отправляем заявку на согласование.
    async function submitRequest(id) {
      clearMessage();
      try {
        await api(`/requests/${id}/submit`, { method: 'POST' });
        showMessage('Заявка отправлена на согласование', 'success-message');
        await showEmployeeRequests();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Показываем заявки руководителю.
    async function showManagerRequests() {
      clearMessage();
      renderManagerMenu();
      try {
        await loadRequests();
        document.getElementById('app').innerHTML = `
          <h1>Заявки</h1>
          <div class="card">
            ${requests.length ? requests.map(renderManagerRequest).join('') : '<div class="empty">Заявок пока нет.</div>'}
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Формируем карточку заявки для руководителя.
    function renderManagerRequest(request) {
      return `
        <div class="request">
          <div class="request-header">
            <div class="request-number">${escapeHtml(request.number)}</div>
            <span class="status">${statusName(request.status)}</span>
          </div>
          <div class="request-info">Сумма: <strong>${formatMoney(request.amount)}</strong></div>
          <div class="request-info">Статья: ${escapeHtml(request.category_name || 'Не указана')}</div>
          <div class="request-info">${escapeHtml(request.description)}</div>
          ${request.oneC_documentId ? `
            <a class="one-c-link" href="${getOneCDocumentUrl(request.oneC_documentId)}" target="_blank">
              Оплачено в 1С · Документ № ${escapeHtml(request.oneC_documentNumber || '')} ↗
            </a>
          ` : ''}
          <div class="actions">
            ${request.status === 'pending_approval' ? `
              <button class="button success" onclick="approveRequest(${request.id})">Согласовать</button>
              <button class="button danger" onclick="rejectRequest(${request.id})">Отклонить</button>
            ` : ''}
            ${request.status === 'approved' ? `
              <button class="button" onclick="payRequest(${request.id})">Передать в 1С</button>
            ` : ''}
          </div>
        </div>
      `;
    }

    // Согласовываем заявку руководителем.
    async function approveRequest(id) {
      const approverName = prompt('Введите имя руководителя:', 'Руководитель');
      if (!approverName) return;
      try {
        await api(`/requests/${id}/approve`, {
          method: 'POST',
          body: JSON.stringify({ approverName })
        });
        showMessage('Заявка согласована', 'success-message');
        await showManagerRequests();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Отклоняем заявку руководителем.
    async function rejectRequest(id) {
      const approverName = prompt('Введите имя руководителя:', 'Руководитель');
      if (!approverName) return;
      const comment = prompt('Причина отклонения:');
      if (!comment) return;
      try {
        await api(`/requests/${id}/reject`, {
          method: 'POST',
          body: JSON.stringify({ approverName, comment })
        });
        showMessage('Заявка отклонена', 'success-message');
        await showManagerRequests();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Передаём согласованную заявку в 1С и добавляем ссылку на документ.
    async function payRequest(id) {
      if (!confirm('Передать заявку в 1С для оплаты?')) return;
      try {
        const result = await api(`/requests/${id}/pay`, { method: 'POST' });
        const documentId = result.oneC?.documentId;
        const documentNumber = result.oneC?.documentNumber;
        if (!documentId) {
          throw new Error('1С создала документ, но не вернула его идентификатор');
        }
        await showManagerRequests();
        const paidRequest = requests.find(item => Number(item.id) === Number(id));
        if (paidRequest) {
          paidRequest.oneC_documentId = documentId;
          paidRequest.oneC_documentNumber = documentNumber;
        }
        document.getElementById('app').innerHTML = `
          <h1>Заявки</h1>
          <div class="card">
            ${requests.length ? requests.map(renderManagerRequest).join('') : '<div class="empty">Заявок пока нет.</div>'}
          </div>
        `;
        showMessage(`Заявка передана в 1С. Документ № ${documentNumber}`, 'success-message');
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Показываем страницу бюджетов.
    async function showBudgets() {
      clearMessage();
      renderManagerMenu();
      try {
        await Promise.all([loadCategories(), loadBudgets()]);
        document.getElementById('app').innerHTML = `
          <h1>Бюджеты</h1>
          <div class="card">
            <h3>Установить или изменить лимит</h3>
            <div class="form-group">
              <label for="budgetCategory">Статья расходов</label>
              <select id="budgetCategory">
                <option value="">Выберите статью</option>
                ${categories.map(category => `<option value="${category.id}">${escapeHtml(category.name)}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label for="budgetAmount">Лимит</label>
              <input id="budgetAmount" type="number" min="1" placeholder="100000">
            </div>
            <div class="form-group">
              <label for="budgetStart">Начало периода</label>
              <input id="budgetStart" type="date" value="${new Date().toISOString().slice(0, 10)}">
            </div>
            <div class="form-group">
              <label for="budgetEnd">Конец периода</label>
              <input id="budgetEnd" type="date" value="${new Date().getFullYear()}-12-31">
            </div>
            <button class="button" onclick="saveBudget()">Сохранить лимит</button>
          </div>
          <div class="card">
            <h3>Установленные лимиты</h3>
            ${budgets.length ? `
              <table class="budget-list">
                <thead>
                  <tr>
                    <th>Статья</th>
                    <th>Лимит</th>
                    <th>Использовано</th>
                    <th>Остаток</th>
                    <th>Период</th>
                  </tr>
                </thead>
                <tbody>
                  ${budgets.map(budget => {
                    const remaining = Number(budget.limit_amount) - Number(budget.reserved_amount || 0);
                    return `
                      <tr>
                        <td>${escapeHtml(budget.category_name || '—')}</td>
                        <td>${formatMoney(budget.limit_amount)}</td>
                        <td>${formatMoney(budget.reserved_amount || 0)}</td>
                        <td>${formatMoney(remaining)}</td>
                        <td>${budget.period_start} — ${budget.period_end}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            ` : '<div class="empty">Бюджеты пока не настроены.</div>'}
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Сохраняем бюджетный лимит.
    async function saveBudget() {
      const categoryId = Number(document.getElementById('budgetCategory').value);
      const limitAmount = Number(document.getElementById('budgetAmount').value);
      const periodStart = document.getElementById('budgetStart').value;
      const periodEnd = document.getElementById('budgetEnd').value;
      if (!categoryId || !limitAmount || !periodStart || !periodEnd) {
        showMessage('Заполните все поля бюджета', 'error');
        return;
      }
      try {
        await api('/budgets', {
          method: 'POST',
          body: JSON.stringify({ categoryId, limitAmount, periodStart, periodEnd })
        });
        showMessage('Бюджет сохранён', 'success-message');
        await showBudgets();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Показываем управление статьями расходов.
    async function showCategories() {
      clearMessage();
      renderManagerMenu();
      try {
        await loadCategories();
        document.getElementById('app').innerHTML = `
          <h1>Статьи расходов</h1>
          <div class="card">
            <h3>Добавить статью</h3>
            <div class="form-group">
              <label for="newCategoryName">Название</label>
              <input id="newCategoryName" placeholder="Например: Транспорт">
            </div>
            <div class="form-group">
              <label for="newCategoryDescription">Описание</label>
              <input id="newCategoryDescription" placeholder="Расходы на транспортные услуги">
            </div>
            <button class="button" onclick="createCategory()">Добавить статью</button>
          </div>
          <div class="card">
            <h3>Существующие статьи</h3>
            ${categories.length ? categories.map(category => `
              <div class="request">
                <div class="category-title">${escapeHtml(category.name)}</div>
                <div class="category-description">${escapeHtml(category.description || 'Описание не указано')}</div>
                <div class="category-actions">
                  <button class="button secondary" onclick="editCategory(${category.id})">Изменить</button>
                  <button class="button danger" onclick="deleteCategory(${category.id})">Удалить</button>
                </div>
              </div>
            `).join('') : '<div class="empty">Статей расходов пока нет.</div>'}
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Создаём новую статью расходов.
    async function createCategory() {
      const name = document.getElementById('newCategoryName').value.trim();
      const description = document.getElementById('newCategoryDescription').value.trim();
      if (!name) {
        showMessage('Введите название статьи', 'error');
        return;
      }
      try {
        await api('/categories', {
          method: 'POST',
          body: JSON.stringify({ name, description })
        });
        showMessage('Статья расходов создана', 'success-message');
        await showCategories();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Изменяем существующую статью расходов.
    async function editCategory(id) {
      const category = categories.find(item => Number(item.id) === Number(id));
      if (!category) return;
      const name = prompt('Название статьи:', category.name);
      if (name === null) return;
      const description = prompt('Описание статьи:', category.description || '');
      if (description === null) return;
      if (!name.trim()) {
        showMessage('Название статьи не может быть пустым', 'error');
        return;
      }
      try {
        await api(`/categories/${id}`, {
          method: 'PUT',
          body: JSON.stringify({
            name: name.trim(),
            description: description.trim()
          })
        });
        showMessage('Статья расходов изменена', 'success-message');
        await showCategories();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Удаляем статью расходов.
    async function deleteCategory(id) {
      const category = categories.find(item => Number(item.id) === Number(id));
      if (!category) return;
      if (!confirm(`Удалить статью «${category.name}»?`)) return;
      try {
        await api(`/categories/${id}`, { method: 'DELETE' });
        showMessage('Статья расходов удалена', 'success-message');
        await showCategories();
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    // Переключаем роль пользователя.
    async function switchRole() {
      const role = document.getElementById('roleSelect').value;
      if (role === 'manager') {
        await showManagerRequests();
      } else {
        await showEmployeeRequests();
      }
    }

    // Инициализируем интерфейс сотрудника при первом открытии.
    async function init() {
      renderEmployeeMenu();
      document.getElementById('app').innerHTML = `
        <h1>Мои заявки</h1>
        <div class="card">
          <div class="empty">Загрузка заявок...</div>
        </div>
      `;
      try {
        await Promise.all([loadCategories(), loadBudgets(), loadRequests()]);
        await showEmployeeRequests();
      } catch (error) {
        showMessage(error.message, 'error');
        document.getElementById('app').innerHTML = `
          <h1>Мои заявки</h1>
          <div class="card">
            <div class="empty">Не удалось загрузить заявки.</div>
          </div>
        `;
      }
    }

    document.getElementById('roleSelect').addEventListener('change', switchRole);
    init();
  </script>
</body>
</html>
